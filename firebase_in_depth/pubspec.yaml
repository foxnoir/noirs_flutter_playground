name: firebase_in_depth
description: A deep dive into Firebase, using Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  cloud_firestore: ^6.0.0
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  intl: any
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.16.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  riverpod_lint: ^3.1.8
  very_good_analysis: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/img/
    - assets/icons/
    - assets/icons/courses/
