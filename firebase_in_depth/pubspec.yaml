name: firebase_in_depth
description: A deep dive into Firebase, using Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_lint: ^3.1.8
  very_good_analysis: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
