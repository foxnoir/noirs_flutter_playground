name: advanced_concepts
description: Practice project for navigation, layout, lists, and API integration.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  http: ^1.5.0
  intl: any
  dio: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_lint: ^3.1.8
  very_good_analysis: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/profiles/
    - assets/img/
    - assets/img/icons/
