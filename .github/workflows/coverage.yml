# Playground monorepo — runs tests and regenerates coverage for every app in
# coverage_pipeline/playground_apps. Does not commit. Badges belong to the
# local pre-commit hook so a push is not followed by a bot coverage commit.
#
# Copied-out single-app repos still use coverage_pipeline/coverage.yml.
name: Coverage badge

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Refresh coverage for every playground app
        run: bash coverage_pipeline/update_all.sh
        env:
          CI: true
