name: Coverage badge

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Refresh coverage images
        run: bash tool/update_coverage.sh

      - name: Coverage must match this commit
        run: git diff --exit-code -- images/coverage.svg images/coverage_badge.svg README.md
