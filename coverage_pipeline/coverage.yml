# Copy to .github/workflows/coverage.yml after this app is its own git repo
# (next to pubspec.yaml, with coverage_pipeline/ at the repo root).
name: Coverage badge

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Refresh coverage images
        run: bash coverage_pipeline/update_coverage.sh

      - name: Coverage must match this commit
        run: git diff --exit-code -- assets/coverage/badge.svg assets/coverage/card.svg README.md
